<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111821" />
  <title>AttoFab — Semiconductor Fabrication Simulator</title>
  <style>
    html, body { margin:0; width:100%; height:100%; background:#111821; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; outline:none; }
    #loading { position:fixed; inset:0; display:grid; place-items:center; color:#dbe7f3;
      font: 14px system-ui, sans-serif; background:#111821; pointer-events:none; }
  </style>
</head>
<body>
  <div id="loading">Loading AttoFab WebAssembly UI…</div>
  <canvas id="attofab-canvas"></canvas>
  <script type="module">
    import init from './pkg/app_web.js';
    try { await init(); document.getElementById('loading')?.remove(); }
    catch (e) { document.getElementById('loading').textContent = 'AttoFab failed to start: ' + e; console.error(e); }
  </script>
</body>
</html>
