<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AttoFab - 2D Cross-Section Renderer</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #2a303a;
    --text: #d7dee6;
    --muted: #8b95a1;
    --accent: #5aa9e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #canvasWrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    background:
      linear-gradient(45deg, #12151a 25%, transparent 25%),
      linear-gradient(-45deg, #12151a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #12151a 75%),
      linear-gradient(-45deg, transparent 75%, #12151a 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  }
  canvas { image-rendering: pixelated; box-shadow: 0 0 0 1px var(--border); }
  #sidebar {
    width: 260px;
    border-left: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
    background: var(--panel);
    font-size: 12px;
  }
  #sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 18px 0 8px; }
  #sidebar h2:first-child { margin-top: 0; }
  .legend-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(255,255,255,0.15); }
  .drop {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
  }
  .drop:hover { border-color: var(--accent); color: var(--text); }
  input[type=file] { display: none; }
  .log-entry {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
    padding: 2px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .stat { display: flex; justify-content: space-between; padding: 2px 0; color: var(--muted); }
  .stat b { color: var(--text); font-weight: 500; }
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: #000c;
    border: 1px solid var(--border);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 11px;
    display: none;
    z-index: 10;
    white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <h1>AttoFab &mdash; 2D Cross-Section Renderer</h1>
  <span class="sub" id="dims">No wafer loaded</span>
</header>
<main>
  <div id="canvasWrap">
    <canvas id="canvas" width="10" height="10"></canvas>
  </div>
  <div id="sidebar">
    <div class="drop" id="dropZone">
      Drop a Wafer2d JSON export here, or click to choose a file<br />
      <input type="file" id="fileInput" accept=".json,application/json" />
    </div>

    <h2>Legend</h2>
    <div id="legend"></div>

    <h2>Wafer Stats</h2>
    <div id="stats"></div>

    <h2>Process Log</h2>
    <div id="log"></div>
  </div>
</main>
<div id="tooltip"></div>

<script>
// Distinct, high-contrast colors per material - matches the Material enum
// used across the Rust core (materials.rs) and JS Phase 1 engine.
const MATERIAL_COLORS = {
  Silicon:             "#4a4e57",
  Oxide:               "#7fc8f8",
  Photoresist:         "#e8b84b",
  PhotoresistExposed:  "#f2d98a",
  Metal:               "#d4d8dc",
  Void:                "#0e1116",
};

const MATERIAL_LABELS = {
  Silicon: "Silicon",
  Oxide: "SiO\u2082 (oxide)",
  Photoresist: "Photoresist (unexposed)",
  PhotoresistExposed: "Photoresist (exposed)",
  Metal: "Metal",
  Void: "Void / ambient",
};

let currentWafer = null;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");

function buildLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  for (const [key, color] of Object.entries(MATERIAL_COLORS)) {
    const row = document.createElement("div");
    row.className = "legend-row";
    row.innerHTML = `<span class="swatch" style="background:${color}"></span><span>${MATERIAL_LABELS[key]}</span>`;
    legend.appendChild(row);
  }
}

function render(wafer) {
  currentWafer = wafer;
  const { nx, ny, material, dx_um, dy_um, oxide_thickness_um, process_log } = wafer;

  document.getElementById("dims").textContent =
    `${nx} x ${ny} voxels  (${(nx * dx_um).toFixed(2)} x ${(ny * dy_um).toFixed(2)} um)`;

  const targetPixelSize = Math.max(2, Math.min(10, Math.floor(900 / nx)));
  canvas.width = nx * targetPixelSize;
  canvas.height = ny * targetPixelSize;

  const imgData = ctx.createImageData(nx, ny);
  for (let y = 0; y < ny; y++) {
    for (let x = 0; x < nx; x++) {
      const m = material[y * nx + x];
      const hex = MATERIAL_COLORS[m] || "#ff00ff";
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const i = (y * nx + x) * 4;
      imgData.data[i] = r;
      imgData.data[i + 1] = g;
      imgData.data[i + 2] = b;
      imgData.data[i + 3] = 255;
    }
  }

  const offscreen = document.createElement("canvas");
  offscreen.width = nx;
  offscreen.height = ny;
  offscreen.getContext("2d").putImageData(imgData, 0, 0);

  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(offscreen, 0, 0, canvas.width, canvas.height);

  const stats = document.getElementById("stats");
  const avgOxide = oxide_thickness_um && oxide_thickness_um.length
    ? oxide_thickness_um.reduce((a, b) => a + b, 0) / oxide_thickness_um.length
    : 0;
  const maxOxide = oxide_thickness_um && oxide_thickness_um.length ? Math.max(...oxide_thickness_um) : 0;
  const counts = {};
  for (const m of material) counts[m] = (counts[m] || 0) + 1;
  stats.innerHTML = `
    <div class="stat"><span>Grid spacing</span><b>${dx_um} x ${dy_um} um</b></div>
    <div class="stat"><span>Avg oxide</span><b>${(avgOxide * 1000).toFixed(1)} nm</b></div>
    <div class="stat"><span>Max oxide</span><b>${(maxOxide * 1000).toFixed(1)} nm</b></div>
    ${Object.entries(counts).map(([m, c]) =>
      `<div class="stat"><span>${MATERIAL_LABELS[m] || m}</span><b>${((c / material.length) * 100).toFixed(1)}%</b></div>`
    ).join("")}
  `;

  const log = document.getElementById("log");
  log.innerHTML = (process_log || []).map(e => `<div class="log-entry">${e}</div>`).join("");

  canvas.dataset.pixelSize = targetPixelSize;
}

canvas.addEventListener("mousemove", (e) => {
  if (!currentWafer) return;
  const rect = canvas.getBoundingClientRect();
  const px = Number(canvas.dataset.pixelSize) * (canvas.width / rect.width);
  const x = Math.floor(((e.clientX - rect.left) * (canvas.width / rect.width)) / px);
  const y = Math.floor(((e.clientY - rect.top) * (canvas.height / rect.height)) / px);
  if (x < 0 || y < 0 || x >= currentWafer.nx || y >= currentWafer.ny) {
    tooltip.style.display = "none";
    return;
  }
  const m = currentWafer.material[y * currentWafer.nx + x];
  const depthUm = (y * currentWafer.dy_um).toFixed(3);
  const lateralUm = (x * currentWafer.dx_um).toFixed(3);
  let speciesLine = "";
  if (currentWafer.species) {
    for (const [dopant, arr] of Object.entries(currentWafer.species)) {
      const c = arr[y * currentWafer.nx + x];
      if (c > 1e10) speciesLine += `<br/>${dopant}: ${c.toExponential(2)} /cm\u00b3`;
    }
  }
  tooltip.style.display = "block";
  tooltip.style.left = (e.clientX + 14) + "px";
  tooltip.style.top = (e.clientY + 14) + "px";
  tooltip.innerHTML = `<b>${MATERIAL_LABELS[m] || m}</b><br/>x=${lateralUm}um depth=${depthUm}um${speciesLine}`;
});
canvas.addEventListener("mouseleave", () => (tooltip.style.display = "none"));

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wafer = JSON.parse(e.target.result);
      render(wafer);
    } catch (err) {
      alert("Failed to parse JSON: " + err.message);
    }
  };
  reader.readAsText(file);
}

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
dropZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => e.target.files[0] && loadFile(e.target.files[0]));
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.style.borderColor = "var(--accent)"; });
dropZone.addEventListener("dragleave", () => (dropZone.style.borderColor = "var(--border)"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.style.borderColor = "var(--border)";
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

buildLegend();
</script>
</body>
</html>
