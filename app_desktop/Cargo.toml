[package]
name = "app_desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AttoFab native desktop application (eframe + egui + wgpu)."

[[bin]]
name = "attofab"
path = "src/main.rs"

[dependencies]
sim_ui = { path = "../sim_ui" }
eframe = { workspace = true, features = ["wgpu", "x11"] }
anyhow.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
